
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>LifeOS | My Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101116;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
    }

    h1 { font-size: 32px; margin-bottom: 6px; }
    p { color: #a1a1aa; }

    .card {
      background: #1c1e26;
      padding: 20px;
      border-radius: 18px;
      margin: 16px 0;
    }

    .progress {
      height: 8px;
      background: #343641;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #76b9ff;
      transition: width 0.3s;
    }

    label {
      display: block;
      padding: 10px 0;
    }

    input { accent-color: #76b9ff; }
  </style>
</head>
<body>
  <p>YOUR PERSONAL COMMAND CENTRE</p>
  <h1>LifeOS.</h1>
  <p>Build a better day, one step at a time.</p>

  <div class="card">
    <h2>Today's Progress</h2>
    <h1 id="score">0%</h1>
    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
  </div>

  <div class="card">
    <h2>Daily Missions</h2>
    <div id="tasks"></div>
  </div>

  <script>
    const missions = [
      "Exercise for 30 minutes",
      "Learn something new",
      "Work on a personal goal",
      "Reflect on my day"
    ];

    const today = new Date().toLocaleDateString("en-CA");
    const key = "lifeos-missions-" + today;
    const saved = JSON.parse(localStorage.getItem(key) || "[]");

    const tasks = document.getElementById("tasks");

    missions.forEach((mission, index) => {
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = saved.includes(index);

      checkbox.addEventListener("change", updateProgress);
      label.append(checkbox, " " + mission);
      tasks.appendChild(label);
    });

    function updateProgress() {
      const boxes = [...document.querySelectorAll(
        'input[type="checkbox"]'
      )];
      const completed = boxes.flatMap((box, index) =>
        box.checked ? [index] : []
      );
      localStorage.setItem(key, JSON.stringify(completed));

      const percent = Math.round(
        (completed.length / missions.length) * 100
      );

      document.getElementById("score").textContent = percent + "%";
      document.getElementById("progress").style.width = percent + "%";
    }

    updateProgress();
  </script>
</body>
</html>
