
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>LifeOS — Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 18px;
      background: #0d1117;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    main { max-width: 600px; margin: auto; }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 2px;
    }

    h1 { font-size: 38px; margin: 8px 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .card {
      background: #1c2432;
      border: 1px solid #30394a;
      padding: 18px;
      border-radius: 20px;
      min-height: 155px;
    }

    .card h2 {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      margin: 0 0 16px;
    }

    .value {
      font-size: 29px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .detail { font-size: 12px; color: #94a3b8; }

    .full { grid-column: 1 / -1; }

    #clock { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <div class="subtitle">YOUR PERSONAL COMMAND CENTRE</div>
    <h1>LifeOS.</h1>
    <p id="date" class="detail">Loading date...</p>

    <section class="grid">
      <div class="card">
        <h2>🕒 Local Time</h2>
        <div class="value" id="clock">--:--</div>
        <div class="detail">Your current time</div>
      </div>

      <div class="card">
        <h2>🌤️ Weather</h2>
        <div class="value" id="temperature">--°C</div>
        <div class="detail" id="weather">
          Requesting weather...
        </div>
      </div>

      <div class="card">
        <h2>👟 Daily Steps</h2>
        <div class="value">—</div>
        <div class="detail">Apple Health connection coming later</div>
      </div>

      <div class="card">
        <h2>📱 Screen Time</h2>
        <div class="value">—</div>
        <div class="detail">iOS integration unavailable in web app</div>
      </div>

      <div class="card full">
        <h2>⚡ Quick Access</h2>
        <p>
          <a href="https://www.icloud.com/calendar/"
             style="color:#93c5fd">Calendar ↗</a>
          &nbsp;&nbsp;
          <a href="https://www.icloud.com/reminders/"
             style="color:#93c5fd">Reminders ↗</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    function updateClock() {
      const now = new Date();

      document.getElementById("clock").textContent =
        now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

      document.getElementById("date").textContent =
        now.toLocaleDateString([], {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });
    }

    updateClock();
    setInterval(updateClock, 1000);

    const weatherCodes = {
      0: "Clear sky",
      1: "Mostly clear",
      2: "Partly cloudy",
      3: "Overcast",
      45: "Fog",
      61: "Light rain",
      63: "Rain",
      65: "Heavy rain",
      71: "Light snow",
      73: "Snow",
      95: "Thunderstorm"
    };

    async function loadWeather(position) {
      const { latitude, longitude } = position.coords;

      const url = new URL(
        "https://api.open-meteo.com/v1/forecast"
      );

      url.searchParams.set("latitude", latitude);
      url.searchParams.set("longitude", longitude);
      url.searchParams.set(
        "current", "temperature_2m,weather_code"
      );

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Weather unavailable");

        const data = await response.json();

        document.getElementById("temperature").textContent =
          Math.round(data.current.temperature_2m) + "°C";

        document.getElementById("weather").textContent =
          weatherCodes[data.current.weather_code] ||
          "Weather updated";
      } catch {
        document.getElementById("weather").textContent =
          "Unable to load weather";
      }
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        loadWeather,
        () => {
          document.getElementById("weather").textContent =
            "Location permission required";
        },
        { timeout: 10000 }
      );
    } else {
      document.getElementById("weather").textContent =
        "Location not supported";
    }
  </script>
</body>
</html>
